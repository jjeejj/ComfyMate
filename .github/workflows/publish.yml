name: Publish Custom Node to Comfy Registry

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Auto-sync pyproject.toml version with Git Tag
        run: |
          python3 -c '
          import os, re
          tag = os.environ.get("GITHUB_REF_NAME", "")
          clean_ver = re.sub(r"^(refs/tags/)?v", "", tag).strip()
          if clean_ver:
              with open("pyproject.toml", "r", encoding="utf-8") as f:
                  content = f.read()
              new_content = re.sub(r"version\s*=\s*\"[^\"]*\"", f"version = \"{clean_ver}\"", content, count=1)
              with open("pyproject.toml", "w", encoding="utf-8") as f:
                  f.write(new_content)
              print(f"✨ Successfully synced pyproject.toml version to: {clean_ver}")
          '
          grep "^version" pyproject.toml

      - name: Publish to Comfy Registry
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: 'true'
